workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 21
      flutter: 3.29.0
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Get SHA1 Fingerprint
        script: |
          cd android && gradlew signingReport || ./gradlew signingReport
      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
